<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden · David Girnstein</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  // Alte Links auf das Framer-Portfolio (z. B. girnstein.studio/work) weiterhin dorthin schicken.
  // TODO: auf https://portfolio.girnstein.studio umstellen, sobald das neue Portfolio live ist.
  (function () {
    var p = location.pathname;
    if (/^\/(about|work|volunteer|contact)(\/|$)/i.test(p)) {
      location.replace("https://girnstein-david.framer.website" + p + location.search);
    }
  })();
</script>
<style>
  :root { --bg:#F5F4EF; --ink:#121212; --ink-2:#4A4A46; --accent:#CDFF00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0B0B0B; --ink:#F2F2EE; --ink-2:#BDBDB6; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:17px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif; padding:16px; }
  h1 { font-size:clamp(40px,8vw,72px); letter-spacing:-.04em; margin:0 0 8px; line-height:1; }
  p { color:var(--ink-2); margin:0 0 24px; }
  a { display:inline-block; padding:12px 18px; border-radius:999px; background:var(--ink); color:var(--bg); text-decoration:none; font-weight:600; }
  span { background:var(--accent); color:#0B0B0B; padding:0 .12em; border-radius:.1em; }
</style>
</head>
<body>
  <main>
    <h1>4<span>0</span>4</h1>
    <p>Diese Seite gibt es nicht (mehr).</p>
    <a href="/">Zu girnstein.studio</a>
  </main>
</body>
</html>
